openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PakApply - Pakistani College Application Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: students
    description: Student profile operations
  - name: universities
    description: University listing and details
  - name: programs
    description: University programs
  - name: applications
    description: Student applications
  - name: storage
    description: File storage operations
  - name: documents
    description: Student document management
  - name: admin
    description: University admin portal operations
  - name: account
    description: Account settings and user management
  - name: support
    description: Help center and student support tickets

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Student Profile ──────────────────────────────────────────────────────────
  /students/me/profile:
    get:
      operationId: getMyProfile
      tags: [students]
      summary: Get student personal profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Profile not found
    put:
      operationId: updateMyProfile
      tags: [students]
      summary: Create or update student personal profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertStudentProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"

  /students/me/academics:
    get:
      operationId: getMyAcademics
      tags: [students]
      summary: Get student academic history
      responses:
        "200":
          description: Academic records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicRecord"
    post:
      operationId: addAcademicRecord
      tags: [students]
      summary: Add an academic record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademicRecordBody"
      responses:
        "201":
          description: Created academic record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicRecord"

  /students/me/academics/{recordId}:
    put:
      operationId: updateAcademicRecord
      tags: [students]
      summary: Update an academic record
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademicRecordBody"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicRecord"
    delete:
      operationId: deleteAcademicRecord
      tags: [students]
      summary: Delete an academic record
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/me/test-scores:
    get:
      operationId: getMyTestScores
      tags: [students]
      summary: Get student test scores
      responses:
        "200":
          description: Test scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestScore"
    post:
      operationId: addTestScore
      tags: [students]
      summary: Add a test score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestScoreBody"
      responses:
        "201":
          description: Created test score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestScore"

  /students/me/test-scores/{scoreId}:
    put:
      operationId: updateTestScore
      tags: [students]
      summary: Update a test score
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestScoreBody"
      responses:
        "200":
          description: Updated score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestScore"
    delete:
      operationId: deleteTestScore
      tags: [students]
      summary: Delete a test score
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/me/activities:
    get:
      operationId: getMyActivities
      tags: [students]
      summary: Get student extracurricular activities
      responses:
        "200":
          description: Activities list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: addActivity
      tags: [students]
      summary: Add an activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityBody"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /students/me/activities/{activityId}:
    put:
      operationId: updateActivity
      tags: [students]
      summary: Update an activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityBody"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    delete:
      operationId: deleteActivity
      tags: [students]
      summary: Delete an activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/me/essays:
    get:
      operationId: getMyEssays
      tags: [students]
      summary: Get student essays
      responses:
        "200":
          description: Essays list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Essay"
    post:
      operationId: createEssay
      tags: [students]
      summary: Create an essay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEssayBody"
      responses:
        "201":
          description: Created essay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Essay"

  /students/me/essays/{essayId}:
    put:
      operationId: updateEssay
      tags: [students]
      summary: Update an essay
      parameters:
        - name: essayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEssayBody"
      responses:
        "200":
          description: Updated essay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Essay"
    delete:
      operationId: deleteEssay
      tags: [students]
      summary: Delete an essay
      parameters:
        - name: essayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/me/dashboard:
    get:
      operationId: getMyDashboard
      tags: [students]
      summary: Get student dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── My Colleges (Saved list) ─────────────────────────────────────────────────
  /students/me/colleges:
    get:
      operationId: listMyColleges
      tags: [student-colleges]
      summary: List colleges saved by the student
      responses:
        "200":
          description: Saved colleges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCollege"
    post:
      operationId: saveCollege
      tags: [student-colleges]
      summary: Save a college to the student's list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCollegeBody"
      responses:
        "201":
          description: College saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollege"

  /students/me/colleges/{universityId}:
    delete:
      operationId: removeCollege
      tags: [student-colleges]
      summary: Remove a college from the student's list
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
    patch:
      operationId: updateCollegeStatus
      tags: [student-colleges]
      summary: Update progress status for a saved college
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollegeStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollege"

  /students/me/colleges/{universityId}/validate:
    get:
      operationId: validateCollegeSubmission
      tags: [student-colleges]
      summary: Check if student is eligible to submit to a college
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation result with eligibility details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollegeSubmitValidation"

  /students/me/colleges/{universityId}/submit:
    post:
      operationId: submitCollegeApplication
      tags: [student-colleges]
      summary: Officially submit a college application with digital signature
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollegeSubmitBody"
      responses:
        "200":
          description: Submission successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollege"
        "400":
          description: Validation failed or already submitted

  # ── Recommenders ─────────────────────────────────────────────────────────────
  /students/me/recommenders:
    get:
      operationId: getMyRecommenders
      tags: [students]
      summary: Get student recommenders
      responses:
        "200":
          description: Recommenders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommender"
    post:
      operationId: inviteRecommender
      tags: [students]
      summary: Invite a recommender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRecommenderBody"
      responses:
        "201":
          description: Recommender invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommender"

  /students/me/recommenders/{recommenderId}:
    delete:
      operationId: deleteRecommender
      tags: [students]
      summary: Remove a recommender invitation
      parameters:
        - name: recommenderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Universities ─────────────────────────────────────────────────────────────
  /universities:
    get:
      operationId: listUniversities
      tags: [universities]
      summary: List all universities
      parameters:
        - name: province
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: deadlineType
          in: query
          schema:
            type: string
        - name: noFee
          in: query
          schema:
            type: string
        - name: noEssay
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of universities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/University"

  /universities/featured:
    get:
      operationId: getFeaturedUniversities
      tags: [universities]
      summary: Get featured/top universities
      responses:
        "200":
          description: Featured universities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/University"

  /universities/stats:
    get:
      operationId: getUniversityStats
      tags: [universities]
      summary: Get aggregate stats about universities
      responses:
        "200":
          description: University statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityStats"

  /universities/{universityId}:
    get:
      operationId: getUniversity
      tags: [universities]
      summary: Get a single university
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: University details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"
        "404":
          description: Not found

  # ── Programs ─────────────────────────────────────────────────────────────────
  /universities/{universityId}/programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List programs offered by a university
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Programs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"

  # ── Applications ─────────────────────────────────────────────────────────────
  /applications:
    get:
      operationId: listMyApplications
      tags: [applications]
      summary: List all applications for the current student
      responses:
        "200":
          description: Applications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Start a new application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationBody"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/summary:
    get:
      operationId: getApplicationsSummary
      tags: [applications]
      summary: Get summary of applications by status
      responses:
        "200":
          description: Applications summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationsSummary"

  /applications/{applicationId}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get a single application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationBody"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    delete:
      operationId: withdrawApplication
      tags: [applications]
      summary: Withdraw an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Withdrawn

  /applications/{applicationId}/submit:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List student documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Save uploaded document metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentBody"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  # ── Admin ─────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admission queue statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin]
      summary: List all submitted applications for review
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: universityId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
      responses:
        "200":
          description: Applications list with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationsResponse"

  /admin/applications/{id}:
    get:
      operationId: getAdminApplication
      tags: [admin]
      summary: Get full detail of an application for review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"

  /admin/applications/{id}/decision:
    put:
      operationId: submitAdminDecision
      tags: [admin]
      summary: Submit a decision on an application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDecisionBody"
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: "#/components/schemas/Application"
                required:
                  - application

  /admin/applications/{id}/remarks:
    get:
      operationId: listAdminRemarks
      tags: [admin]
      summary: List internal remarks for an application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Remarks list
          content:
            application/json:
              schema:
                type: object
                properties:
                  remarks:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminRemark"
                required:
                  - remarks
    post:
      operationId: addAdminRemark
      tags: [admin]
      summary: Add an internal remark to an application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remark:
                  type: string
              required:
                - remark
      responses:
        "201":
          description: Remark added
          content:
            application/json:
              schema:
                type: object
                properties:
                  remark:
                    $ref: "#/components/schemas/AdminRemark"
                required:
                  - remark

  # ── Account Settings ─────────────────────────────────────────────────────────
  /account/me:
    get:
      operationId: getAccountMe
      tags: [account]
      summary: Get full account info including avatar and preferences
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"

  /account/change-password:
    put:
      operationId: changePassword
      tags: [account]
      summary: Change account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "400":
          description: Incorrect current password or validation error

  /account/change-email:
    put:
      operationId: changeEmail
      tags: [account]
      summary: Change account email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailBody"
      responses:
        "200":
          description: Email updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  message:
                    type: string
                required: [email, message]
        "400":
          description: Incorrect password
        "409":
          description: Email already in use

  /account/avatar/request-url:
    post:
      operationId: requestAvatarUploadUrl
      tags: [account]
      summary: Get a presigned upload URL for avatar image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUploadRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadUrlResponse"

  /account/avatar:
    put:
      operationId: saveAvatar
      tags: [account]
      summary: Save avatar objectPath after GCS upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectPath:
                  type: string
              required: [objectPath]
      responses:
        "200":
          description: Avatar saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                required: [avatarUrl]

  /account/preferences:
    get:
      operationId: getAccountPreferences
      tags: [account]
      summary: Get notification preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    put:
      operationId: updateAccountPreferences
      tags: [account]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete account and all data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required: [password]
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "400":
          description: Incorrect password

  # ── Help & Support ────────────────────────────────────────────────────────
  /support/tickets:
    get:
      operationId: listMyTickets
      tags: [support]
      summary: List the current student's own support tickets
      responses:
        "200":
          description: Student's tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportTicket"
                required: [tickets]
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Submit a new support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketBody"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: "#/components/schemas/SupportTicket"
                required: [ticket]

  /admin/support/tickets:
    get:
      operationId: listAdminSupportTickets
      tags: [support]
      summary: List all support tickets (admin only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved]
      responses:
        "200":
          description: All tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportTicket"
                required: [tickets]

  /admin/support/tickets/{id}/reply:
    put:
      operationId: replyToTicket
      tags: [support]
      summary: Admin reply to a support ticket and set status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReplyBody"
      responses:
        "200":
          description: Ticket updated with reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: "#/components/schemas/SupportTicket"
                required: [ticket]

